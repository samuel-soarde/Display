<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo-Cores</title>
    <link rel="stylesheet" href="/modo_cores/css/global.css">
</head>

<body>

    <!-- SEÇÃO MODELO RGB -->
    <section id="rgb" class="color-section">
        <aside class="color-section__sidebar">
            <h2 class="color-section__title">Modelo RGB</h2>
            <nav class="color-section__menu">
                <a href="#rgb" class="color-section__link color-section__link--active">RGB</a>
                <a href="#cmyk" class="color-section__link">CMYK</a>
                <a href="#netflix" class="color-section__link">Netflix</a>
                <a href="#google" class="color-section__link">Google</a>
            </nav>
        </aside>

        <div class="color-section__bar color-section__bar--rgb-1"><p>255, 0, 0</p></div>
        
        <div class="color-section__bar color-section__bar--rgb-2"><p>0, 255, 0</p></div>
        
        <div class="color-section__bar color-section__bar--rgb-3"><p>0, 0, 255</p></div>
        
        <div class="color-section__bar color-section__bar--rgb-4"><p>255, 255, 0</p></div>
        
        <div class="color-section__bar color-section__bar--rgb-5"><p>0, 255, 255</p></div>
        
        <div class="color-section__bar color-section__bar--rgb-6"><p>255, 0, 255</p></div>

    </section>

    <!-- SEÇÃO MODELO CMYK -->
    <section id="cmyk" class="color-section">

        <aside class="color-section__sidebar">
            <h2 class="color-section__title">Modelo CMYK</h2>
            <nav class="color-section__menu">
                <a href="#rgb" class="color-section__link">RGB</a>
                <a href="#cmyk" class="color-section__link color-section__link--active">CMYK</a>
                <a href="#netflix" class="color-section__link">Netflix</a>
                <a href="#google" class="color-section__link">Google</a>
            </nav>
        </aside>

        <div class="color-section__bar color-section__bar--cmyk-1"><p>#e60000</p></div>

        <div class="color-section__bar color-section__bar--cmyk-2"><p>#006b00</p></div>
        
        <div class="color-section__bar color-section__bar--cmyk-3"><p>#0000ae</p></div>
        
        <div class="color-section__bar color-section__bar--cmyk-4"><p>#dfdf05</p></div>
        
        <div class="color-section__bar color-section__bar--cmyk-5"><p>#03e6e6</p></div>
        
        <div class="color-section__bar color-section__bar--cmyk-6"><p>#d900d9</p></div>

    </section>

    <!-- SEÇÃO MODELO Netflix -->
    <section id="netflix" class="color-section">

        <aside class="color-section__sidebar">
            <h2 class="color-section__title">Modelo Netflix</h2>
            <nav class="color-section__menu">
                <a href="#rgb" class="color-section__link">RGB</a>
                <a href="#cmyk" class="color-section__link">CMYK</a>
                <a href="#netflix" class="color-section__link color-section__link--active">Netflix</a>
                <a href="#google" class="color-section__link">Google</a>
            </nav>
        </aside>

        <div class="color-section__bar color-section__bar--netflix-1"></div>

        <div class="color-section__bar color-section__bar--netflix-2"></div>
        
        <div class="color-section__bar color-section__bar--netflix-3"></div>
        
        <div class="color-section__bar color-section__bar--netflix-4"></div>
        
        <div class="color-section__bar color-section__bar--netflix-5"></div>
        
        <div class="color-section__bar color-section__bar--netflix-6"></div>

    </section>

    <!-- SEÇÃO MODELO Google -->
    <section id="google" class="color-section">

        <aside class="color-section__sidebar">
            <h2 class="color-section__title">Modelo Google</h2>
            <nav class="color-section__menu">
                <a href="#rgb" class="color-section__link">RGB</a>
                <a href="#cmyk" class="color-section__link">CMYK</a>
                <a href="#netflix" class="color-section__link">Netflix</a>
                <a href="#google" class="color-section__link color-section__link--active">Google</a>
            </nav>
        </aside>

        <div class="color-section__bar color-section__bar--google-1"></div>

        <div class="color-section__bar color-section__bar--google-2"></div>
        
        <div class="color-section__bar color-section__bar--google-3"></div>
        
        <div class="color-section__bar color-section__bar--google-4"></div>
        
        <div class="color-section__bar color-section__bar--google-5"></div>
        
        <div class="color-section__bar color-section__bar--google-6"></div>

    </section>

</body>

</html>
